  - id: deep-learning
    year: 2024
    title: { en: "Introduction to Deep Learning", id: "Pengantar Deep Learning" }
    summary:
      en: "Neural networks, backpropagation, CNNs, RNNs and Transformers, with applications to computer vision and text."
      id: "Jaringan saraf, backpropagation, CNN, RNN, dan Transformer, dengan penerapan pada computer vision dan data teks."
    description:
      en: "This course covers the fundamentals of deep learning, including neural networks, backpropagation, CNNs, RNNs, and their applications in computer vision and textual data."
      id: "Mata kuliah ini membahas dasar-dasar deep learning, termasuk jaringan saraf, backpropagation, CNN, RNN, dan penerapannya dalam computer vision maupun data tekstual."
    outline:
