# Paragraphs support Markdown (links, emphasis).
bio:
  en:
    - "Wahyu Pebrianto is a researcher and lecturer in the Department of Information Technology at [Jember State Polytechnic](https://www.polije.ac.id/), Indonesia. His current research interests include Deep Learning, Computer Vision, and Multimodal AI."
    - "He received his Master's degree in Electrical Engineering, majoring in Systems of Communication and Informatics, from [University of Brawijaya](https://www.ub.ac.id/), Indonesia, in 2023, under the guidance of Assoc. Prof. Panca Mudjirahardjo and Prof. Sholeh Hadi Pramono."
    - "Earlier in his career he worked as a Software Engineer at Soluta and Forendsmith (2018–2019), and as an Artificial Intelligence Engineer specializing in Deep Learning for Computer Vision at PT Super Giga Generasi (from 2021). In 2024 he joined Jember State Polytechnic as a lecturer."
  id:
    - "Wahyu Pebrianto adalah peneliti dan dosen di Jurusan Teknologi Informasi, [Politeknik Negeri Jember](https://www.polije.ac.id/), Indonesia. Minat penelitiannya saat ini meliputi Deep Learning, Computer Vision, dan Multimodal AI."
    - "Ia meraih gelar Magister Teknik Elektro, peminatan Sistem Komunikasi dan Informatika, dari [Universitas Brawijaya](https://www.ub.ac.id/), Indonesia, pada 2023, di bawah bimbingan Assoc. Prof. Panca Mudjirahardjo dan Prof. Sholeh Hadi Pramono."
    - "Sebelumnya ia bekerja sebagai Software Engineer di Soluta dan Forendsmith (2018–2019), serta sebagai Artificial Intelligence Engineer yang berfokus pada Deep Learning untuk Computer Vision di PT Super Giga Generasi (sejak 2021). Pada 2024 ia bergabung dengan Politeknik Negeri Jember sebagai dosen."

