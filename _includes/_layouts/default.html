{%- include i18n.html -%}
<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  {%- include head.html %}
</head>
<body class="layout-{{ page.layout }}">
  <a class="skip-link" href="#main">{{ t.skip_to_content }}</a>
  {% include header.html %}
  <main id="main" class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" defer></script>
  {%- if page.layout == "blog" %}
  <script src="{{ '/assets/js/blog-filter.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" defer></script>
  {%- endif %}
</body>
</html>
